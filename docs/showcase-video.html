<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scorpio — Mascot login showcase</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: #0b0f17;
      color: #e6edf3;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main { max-width: 960px; width: 100%; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: #9aa4b2; line-height: 1.5; margin: 0 0 16px; }
    video {
      width: 100%;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    a { color: #22d3ee; }
  </style>
</head>
<body>
  <main>
    <h1>Project Scorpio — mascot login showcase</h1>
    <p>
      Fake demo credentials only (<code>blorp.mcfake@totally-not-real.invalid</code>).
      Email curiosity, password reactions, wrong-login dismay, and success celebration.
    </p>
    <video controls playsinline preload="metadata" poster="screenshots/00-auth-mascots-hero.png">
      <source src="videos/mascot-login-showcase.webm" type="video/webm" />
      Your browser does not support WebM playback.
    </video>
    <p style="margin-top: 16px;">
      <a href="https://github.com/faridali2003/project_scorpio">Back to repository</a>
